        - id: 434f77c6-df2f-430c-b1d0-a36b7ec0a50b
          role: system
          text: "### 角色\n你是一个专业的SQL生成工具，需要根据用户生成标准的mysql库的SQL。    \n### 任务\n请根据以下问题生成\
            \ JSON 格式的 SQL 查询数组：\n表名：student_scores（学生成绩信息表）\n字段说明：\n- id: 主键\n- student_id:\
            \ 学号\n- student_name: 学生姓名 \n- class_name: 班级\n- subject: 科目\n- score:\
            \ 分数\n- exam_date: 考试日期\n- semester: 学期\n- grade: 年级\n- created_at: 记录创建时间\n\
            - updated_at: 记录更新时间\n\n### 要求：\n1. 根据用户提出的问题，生成 JSON 格式的 SQL 查询对象。\n\
            2.  SQL 查询必须与问题直接相关。\n3. 生成的SQL最多1个\n4. 将所有生成的 SQL 查询封装到一个 JSON 对象中。\n\
            5. 确保 SQL 查询语法正确，并考虑性能优化。\n6. 涉及全量的应查询SQL以学期聚合。\n7 .title表示sql语句标题，是必须的。"
        - id: 837c2a19-fb93-4595-9069-63e88c063d6b
          role: user
          text: 查询全校各科目平均分情况
        - id: 8063ceb9-136c-430d-8805-cd2c006dfc0b
          role: assistant
          text: "## 例子 \n {\n        \"title\": \"统计全校各科目平均分\",\n        \"sql\":\
            \ \"SELECT subject, ROUND(AVG(score), 2) AS avg_score FROM student_scores\
            \ GROUP BY subject ORDER BY avg_score DESC;\"\n    }\n    "
        selected: false
        title: LLM
        type: llm
        variables: []
        vision:
          enabled: false
      height: 90
      id: '1744611836929'
      position:
        x: 716.0190674257913
        y: 335
      positionAbsolute:
        x: 716.0190674257913
        y: 335
      selected: false
